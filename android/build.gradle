group 'br.com.yanncabral.open_settings_plus'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9+ compiles Kotlin itself (built-in Kotlin) unless the app opts out with
// android.builtInKotlin=false. Only then, or on AGP < 9, apply the Kotlin Gradle Plugin here.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (!builtInKotlin) {
    // pluginManager.apply, not `apply plugin: 'kotlin-android'`: the Flutter tool scans this file
    // for that literal to warn consumers about plugins that apply KGP, and it cannot see the guard
    // above. Applying through the plugin manager is equivalent but keeps the warning accurate.
    pluginManager.apply('kotlin-android')
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace "br.com.yanncabral.open_settings_plus"
    }
// Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("testNamespace")) {
        testNamespace "br.com.yanncabral.open_settings_plus.test"
    }
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Built-in Kotlin takes jvmTarget from compileOptions.targetCompatibility above, so it needs
    // no compiler config here. On the KGP path keep the original kotlinOptions: a top-level
    // `kotlin { compilerOptions { … } }` block would require KGP 2.0+, raising this library's
    // minimum (it still declares Kotlin 1.8.20 and supports Flutter >= 3.41).
    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = '11'
        }
    }

    defaultConfig {
        minSdkVersion 16
    }
}
