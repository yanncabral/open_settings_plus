name: Validate and publish

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos --fatal-warnings .
      - run: flutter test
      - name: Test example
        run: flutter test
        working-directory: example

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: '8.13.2'
            gradle: '8.13'
            built-in-kotlin: 'false'
            flutter: '3.41.0'
          - agp: '9.0.1'
            gradle: '9.1.0'
            built-in-kotlin: 'false'
            flutter: '3.44.1'
          - agp: '9.0.1'
            gradle: '9.1.0'
            built-in-kotlin: 'true'
            flutter: 'stable'
          - agp: '9.0.1'
            gradle: '9.1.0'
            built-in-kotlin: 'default'
            flutter: 'stable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          cache: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Configure consumer compatibility matrix
        env:
          TEST_AGP: ${{ matrix.agp }}
          TEST_GRADLE: ${{ matrix.gradle }}
          TEST_BUILT_IN_KOTLIN: ${{ matrix.built-in-kotlin }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          android = Path('example/android')
          settings = android / 'settings.gradle'
          settings.write_text(settings.read_text().replace('8.13.2', os.environ['TEST_AGP']))
          wrapper = android / 'gradle/wrapper/gradle-wrapper.properties'
          wrapper.write_text(wrapper.read_text().replace('gradle-8.13-all', 'gradle-' + os.environ['TEST_GRADLE'] + '-all'))
          kotlin_setting = os.environ['TEST_BUILT_IN_KOTLIN']
          built_in = int(os.environ['TEST_AGP'].split('.')[0]) >= 9 and kotlin_setting != 'false'
          if os.environ['TEST_AGP'].startswith('9.'):
              with (android / 'gradle.properties').open('a') as properties:
                  if kotlin_setting != 'default':
                      properties.write('\nandroid.builtInKotlin=' + str(built_in).lower() + '\n')
                  properties.write('\nandroid.newDsl=false\n')
          if built_in:
              app = android / 'app/build.gradle'
              app.write_text(app.read_text().replace('    id "kotlin-android"\n', '').replace("    kotlinOptions {\n        jvmTarget = '11'\n    }\n", '') + '\nkotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11 } }\n')
          PY
      - run: flutter pub get
      - name: Build Android consumer
        run: flutter build apk --debug
        working-directory: example
      - name: Test native Android intent routing
        if: matrix.agp == '8.13.2'
        run: ./gradlew :open_settings_plus:testDebugUnitTest
        working-directory: example/android

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        integration: [swift-package-manager, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Select Apple dependency manager
        env:
          INTEGRATION: ${{ matrix.integration }}
        run: |
          if [ "$INTEGRATION" = 'cocoapods' ]; then
            # The project's pubspec setting takes precedence over global config.
            python3 - <<'PY'
          from pathlib import Path
          pubspec = Path('example/pubspec.yaml')
          pubspec.write_text(pubspec.read_text().replace('enable-swift-package-manager: true', 'enable-swift-package-manager: false'))
          PY
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi
      - run: flutter pub get
      - name: Test native iOS settings routing
        if: matrix.integration == 'swift-package-manager'
        run: |
          flutter precache --ios
          bash tool/test_native_ios.sh
      - name: Build iOS consumer
        run: flutter build ios --no-codesign
        working-directory: example

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, android, ios]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1
      - run: flutter pub get
      - run: dart pub publish --force
